[project]
name = "rowanjobs"
version = "1.0.0"
description = "Longitudinal archive of public advertisements on the Rowan University career site"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mark Sedlock" }]
dependencies = [
    # Patched SQLite runtime. apsw 3.53.4.0 bundles SQLite 3.53.4, which contains
    # the WAL-reset corruption fix (SQLite 3.51.3 / 3.53.0 and later).
    # See docs/SQLITE_RUNTIME.md for the recorded evidence.
    "apsw>=3.53.4.0,<3.54",
    "httpx[http2]>=0.28,<0.29",
    "lxml>=5.3,<7",
]

[project.optional-dependencies]
# Only needed when the source requires a browser to satisfy an access challenge.
browser = ["playwright>=1.49,<2"]

[project.scripts]
rowanjobs = "rowanjobs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rowanjobs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "A", "DTZ"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A002"]

[tool.mypy]
python_version = "3.12"
files = ["src/rowanjobs"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: slower integration-style tests"]
filterwarnings = ["error::DeprecationWarning:rowanjobs.*"]
